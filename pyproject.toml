[project]
name = "recommend"
version = "0.1.0"
description = "A 股股票推荐系统（独立于 quantitative 量化项目）"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
free-data = ["openpyxl>=3.1", "lxml>=5.0", "baostock>=0.9.3"]
web = ["streamlit>=1.38"]

[project.scripts]
recommend = "recommend.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
